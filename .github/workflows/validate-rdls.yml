name: Validate RDLS metadata

on:
  push:
    paths:
      - "Sources/**/metadata/*.json"
      - "schema/rdls/**"
      - "Tests/test_rdls_metadata.py"
  pull_request:
    paths:
      - "Sources/**/metadata/*.json"
      - "schema/rdls/**"
      - "Tests/test_rdls_metadata.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema pytest
      - run: pytest Tests/test_rdls_metadata.py -v
